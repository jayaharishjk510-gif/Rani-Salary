<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Salary, Advance, and Staff Management System for Rani Stores" />
    
    <!-- Mobile & PWA Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rani Salary" />
    <meta name="application-name" content="Rani Salary" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Rani Salary</title>
    <!-- Automatic Service Worker Retirement & Cache Clearance -->
    <script>
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) caches.delete(names[j]);
            });
          }
        } catch (e) {}

        // Global Error Catcher for pre-React script failures
        window.addEventListener('error', function(e) {
          showFallbackError((e && e.message) || 'A temporary script loading error occurred.');
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          showFallbackError((e && e.reason && e.reason.message) || 'A network connection promise was interrupted.');
        });

        function showFallbackError(msg) {
          var container = document.getElementById('startup-status-container');
          var errorBox = document.getElementById('startup-error-actions');
          var title = document.getElementById('startup-title');
          var desc = document.getElementById('startup-desc');
          var spinner = document.getElementById('startup-spinner');
          if (container && errorBox && title && desc) {
            if (spinner) spinner.style.display = 'none';
            title.textContent = "We'll be back soon";
            desc.innerHTML = "A temporary connection glitch occurred while launching the application.<br/>Don't worry, all salary and staff data is safely preserved in the cloud database.";
            errorBox.style.display = 'flex';
            var detail = document.getElementById('startup-error-detail');
            if (detail && msg) {
              detail.textContent = msg;
              detail.style.display = 'block';
            }
          }
        }

        // Failsafe timeout: If React hasn't replaced #root within 6 seconds, show the recovery actions
        setTimeout(function() {
          var container = document.getElementById('startup-status-container');
          if (container) {
            showFallbackError('Initial connection took longer than expected.');
          }
        }, 6000);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:-apple-system,sans-serif;padding:20px;text-align:center;">
        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px 24px;max-width:440px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.05);">
          <h2 style="margin:0 0 10px;color:#0f172a;font-size:20px;">JavaScript Required</h2>
          <p style="margin:0;color:#64748b;font-size:14px;line-height:1.5;">Please enable JavaScript in your browser settings to run Rani Salary.</p>
        </div>
      </div>
    </noscript>
    <div id="root">
      <!-- Pre-rendered graceful startup screen (automatically replaced once React mounts) -->
      <div id="startup-status-container" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:'Plus Jakarta Sans','Inter',-apple-system,sans-serif;padding:24px;box-sizing:border-box;">
        <div style="max-width:460px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.06),0 8px 10px -6px rgba(0,0,0,0.04);box-sizing:border-box;">
          
          <!-- Cloud Status Indicator Pill -->
          <div style="display:inline-flex;align-items:center;gap:6px;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:4px 12px;border-radius:50px;font-size:12px;font-weight:700;margin-bottom:20px;letter-spacing:0.3px;">
            <span style="width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block;"></span>
            Cloud Database Secure
          </div>

          <div id="startup-spinner" style="width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#0f172a;border-radius:50%;margin:0 auto 18px;animation:startupSpin 0.8s linear infinite;"></div>

          <h2 id="startup-title" style="margin:0 0 10px;font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-0.3px;">
            Loading Rani Salary…
          </h2>

          <p id="startup-desc" style="margin:0 0 20px;font-size:14px;color:#64748b;line-height:1.6;">
            Connecting to cloud payroll database. Please wait a moment.
          </p>

          <!-- Recovery actions shown only if startup is delayed or interrupted -->
          <div id="startup-error-actions" style="display:none;flex-direction:column;gap:10px;margin-top:20px;">
            <button onclick="window.location.reload(true)" style="background:#0f172a;color:#ffffff;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 6px -1px rgba(15,23,42,0.15);">
              Refresh Application
            </button>
            <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.href='/';" style="background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;">
              Clear Session & Restart
            </button>
            <div id="startup-error-detail" style="display:none;margin-top:10px;padding:10px;background:#0f172a;color:#f87171;font-size:11px;font-family:monospace;border-radius:8px;text-align:left;word-break:break-all;"></div>
          </div>

          <style>
            @keyframes startupSpin {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
            }
          </style>
        </div>
      </div>
    </div>

      If you open it directly in the browser, you will see an empty page.

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
